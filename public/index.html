<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice AI</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b23;
    --panel2: #1d242f;
    --text: #e6ebf2;
    --muted: #8b96a5;
    --accent: #4f8cff;
    --accent2: #34d399;
    --user: #232b37;
    --agent: #1c2f4a;
    --err: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid #232b37;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 12px; border-radius: 999px;
    background: var(--panel2); color: var(--muted);
    font-size: 13px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #556; }
  .pill.listening .dot { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); animation: pulse 1.6s infinite; }
  .pill.thinking .dot { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; animation: pulse .8s infinite; }
  .pill.speaking .dot  { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse .8s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .spacer { flex: 1; }
  button {
    background: var(--accent); color: #fff; border: 0;
    padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  button.secondary { background: var(--panel2); color: var(--text); }
  button:disabled { opacity: .5; cursor: default; }
  #transcript {
    flex: 1; overflow-y: auto;
    padding: 20px;
    display: flex; flex-direction: column; gap: 10px;
    max-width: 780px; width: 100%; margin: 0 auto;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-start; }
  .row.agent { justify-content: flex-end; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble { background: var(--user); border-bottom-left-radius: 4px; }
  .row.agent .bubble { background: var(--agent); border-bottom-right-radius: 4px; }
  .bubble.partial { opacity: .55; font-style: italic; }
  #draft {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px; border-bottom-left-radius: 4px;
    background: var(--user);
    opacity: .55; font-style: italic;
    display: none;
    white-space: pre-wrap;
  }
  footer {
    padding: 10px 20px;
    background: var(--panel);
    border-top: 1px solid #232b37;
    display: flex; align-items: center; gap: 14px;
    font-size: 13px; color: var(--muted);
  }
  #meter { width: 120px; height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; }
  #meterFill { height: 100%; width: 0%; background: var(--accent2); transition: width 60ms linear; }
  #toast {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: #3a1d1d; color: var(--err);
    padding: 8px 16px; border-radius: 8px; font-size: 13px;
    display: none; max-width: 80%;
  }
</style>
</head>
<body>
  <header>
    <h1>Voice AI</h1>
    <span class="pill" id="pill"><span class="dot"></span><span id="pillText">disconnected</span></span>
    <span class="pill" id="llmPill" style="display:none">echo mode</span>
    <span class="spacer"></span>
    <button id="resetBtn" class="secondary" disabled>New conversation</button>
    <button id="connectBtn">Connect &amp; enable mic</button>
  </header>

  <div id="transcript">
    <div id="draft"></div>
  </div>

  <footer>
    <div id="meter"><div id="meterFill"></div></div>
    <span id="footNote">Click connect, allow the microphone, then just start talking. Pause ~1s between turns.</span>
  </footer>

  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
